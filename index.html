<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algo está cambiando!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor Principal en forma de Card -->
  <main class="main-card">
    
    <!-- Encabezado principal con Logo -->
    <header class="header">
      <div class="logo-container">
        <img src="https://github.com/DanielBarrera001/Recursos/blob/main/LOGOS/eco%20crop.png?raw=true" alt="Logo Escuela" class="school-logo">
      </div>
      <h1>¡Algo está cambiando!</h1>
      <p class="subtitle">¿Y si el futuro de nuestra escuela empieza arriba?</p>
      <p class="subtitle">#ECOsolar</p>
    </header>

    <!-- Sección del Contador Regresivo -->
    <section class="countdown-container">
      <div class="time-block">
        <span id="days">00</span>
        <small>Días</small>
      </div>
      <div class="time-block">
        <span id="hours">00</span>
        <small>Horas</small>
      </div>
      <div class="time-block">
        <span id="minutes">00</span>
        <small>Minutos</small>
      </div>
      <div class="time-block">
        <span id="seconds">00</span>
        <small>Segundos</small>
      </div>
    </section>

    <!-- Mensaje cuenta regresiva -->
    <div id="event-message" class="event-message" style="display: none;">
      <h2>¡Bienvenidos a la Exposición!</h2>
      <p>La muestra de fotografías y videos ya está disponible. Disfruta de la presentación.</p>
    </div>

    <!-- Footer redes sociales -->
    <footer class="social-footer">
      <p>Síguenos en nuestras redes:</p>
      <div class="social-links">
        <a href="https://www.instagram.com/eco.santaana/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.facebook.com/ecosantaanasv" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
